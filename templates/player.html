{% extends "layout.html" %}

{% block content %}
<div class="player-container" id="regular-play">
    <h2>Player: <span id="player-name">{{ name }}</span></h2>
    <h3>Score: $<span id="player-score">0</span></h3>
    <div id="status">Waiting...</div>
    <button id="buzz-btn" disabled aria-label="Buzz">BUZZ</button>
    <div id="player-timer" style="display:none; margin-top: 20px; font-size: 2rem; color: gold;"></div>
    <div id="media-container" style="margin-top: 10px; text-align:center;"></div>
</div>

<div class="player-container" id="dd-wager-container" style="display:none;">
    <h3>Daily Double!</h3>
    <div id="dd-wager-max" style="margin: 10px 0; font-size: 1.6rem;"></div>
    <label>Enter Wager:</label>
    <input type="number" id="dd-wager" style="font-size: 2rem; width: 80%;" min="0">
    <button onclick="submitDDWager()" style="font-size: 2rem; margin-top: 20px;">Submit Wager</button>
</div>

<div class="player-container" id="fj-wager-container" style="display:none;">
    <h3>Final Jeopardy</h3>
    <h4 id="fj-category-wager"></h4>
    <div id="fj-score-display" style="margin: 10px 0; font-size: 1.6rem;"></div>
    <label>Enter Wager:</label>
    <input type="number" id="fj-wager" style="font-size: 2rem; width: 80%;">
    <button onclick="submitFJWager()" style="font-size: 2rem; margin-top: 20px;">Submit Wager</button>
</div>

<div class="player-container" id="fj-answer-container" style="display:none;">
   <h3>Final Jeopardy</h3>
   <h4>Clue Revealed!</h4>
   <label>Enter Answer:</label>
   <input type="text" id="fj-answer" style="font-size: 2rem; width: 80%;">
   <button onclick="submitFJAnswer()" style="font-size: 2rem; margin-top: 20px;">Submit Answer</button>
</div>

<div class="player-container" id="fj-wait" style="display:none;">
    <h3>Wait for others...</h3>
</div>

<script>
    const socket = io();
    const name = "{{ name }}";

    // Generate/Retrieve UUID for persistence
    function getPlayerId() {
        let id = localStorage.getItem('jeopardy_player_id');
        if (!id) {
            // Simple random ID generation if crypto not available or for simplicity
            id = 'player-' + Math.random().toString(36).substr(2, 9) + Date.now();
            localStorage.setItem('jeopardy_player_id', id);
        }
        return id;
    }

    const playerId = getPlayerId();

    // Player state
    let mySid = null;
    let isMyTurn = false;
    let playerCountdown = null;
    let ddAwaitingWager = false;

    socket.on('connect', () => {
        socket.emit('join_game', {name: name, player_id: playerId});
        mySid = socket.id;
    });

    socket.on('buzzers_cleared', () => {
        $('#buzz-btn').prop('disabled', false).removeClass('buzzed-winner buzzed-loser').text("BUZZ");
        $('#status').text("GO!");
    });

    socket.on('buzzers_locked', () => {
        $('#buzz-btn').prop('disabled', true).removeClass('buzzed-winner buzzed-loser').text("BUZZ CLOSED");
        $('#status').text("Waiting for host to open buzzers");
    });

    socket.on('buzzers_reopened', (data) => {
        // Check if this player is locked out
        const lockedOut = data.locked_out || [];
        if (lockedOut.includes(socket.id)) {
            // This player already buzzed incorrectly, stay disabled
            $('#buzz-btn').prop('disabled', true).removeClass('buzzed-winner').addClass('buzzed-loser').text("LOCKED OUT");
            $('#status').text("You already answered");
        } else {
            // Re-enable buzzer for this player
            $('#buzz-btn').prop('disabled', false).removeClass('buzzed-winner buzzed-loser').text("BUZZ");
            $('#status').text("GO!");
        }
    });

    socket.on('buzz_winner', (data) => {
        $('#buzz-btn').prop('disabled', true);
        isMyTurn = (data.sid === mySid);
        if (isMyTurn) {
            $('#buzz-btn').addClass('buzzed-winner').text("YOU BUZZED!");
            $('#status').text("Answer Now!");
            startPlayerTimer(10);
        } else {
            $('#buzz-btn').addClass('buzzed-loser').text(data.name + " Buzzed");
            $('#status').text("Locked out");
        }
    });

    // Daily Double wager prompt (only sent to the DD player)
    socket.on('dd_wager_prompt', (data) => {
        ddAwaitingWager = true;
        $('#regular-play').hide();
        $('#dd-wager-container').show();
        const maxWager = (data && typeof data.max_wager === 'number') ? data.max_wager : null;
        if (maxWager !== null) {
            $('#dd-wager-max').text(`Maximum Wager: $${maxWager}`);
            $('#dd-wager').attr('max', maxWager);
        } else {
            $('#dd-wager-max').text('Enter your wager');
            $('#dd-wager').removeAttr('max');
        }
        $('#dd-wager').val('');
    });

    socket.on('dd_wager_rejected', (data) => {
        const msg = (data && data.message) ? data.message : 'Wager rejected';
        $('#status').text(msg);
        ddAwaitingWager = true;
        $('#regular-play').hide();
        $('#dd-wager-container').show();
    });

    function submitDDWager() {
        const wager = parseInt($('#dd-wager').val()) || 0;
        socket.emit('player_dd_wager', {wager: wager});
        // Optimistic UI: wait state until clue is revealed
        $('#dd-wager-container').hide();
        $('#regular-play').show();
        $('#status').text('Wager submitted. Waiting for clue...');
        ddAwaitingWager = false;
    }

    socket.on('score_update', (players) => {
        const myData = players.find(p => p.name === name);
        if (myData) {
            $('#player-score').text(myData.score);
        }
    });

    $('#buzz-btn').click(() => {
        socket.emit('buzz');
    });

    function startPlayerTimer(duration) {
        clearPlayerTimer();
        let t = duration;
        $('#player-timer').show().text(`Time: ${t}s`);
        playerCountdown = setInterval(() => {
            t -= 1;
            if (t <= 0) {
                clearPlayerTimer();
                $('#player-timer').hide();
            } else {
                $('#player-timer').text(`Time: ${t}s`);
            }
        }, 1000);
    }

    function clearPlayerTimer() {
        if (playerCountdown) {
            clearInterval(playerCountdown);
            playerCountdown = null;
        }
    }

    // Final Jeopardy
    socket.on('start_final_jeopardy', (data) => {
        $('#regular-play').hide();
        $('#fj-category-wager').text(data.category);

        // Show current score
        const currentScore = $('#player-score').text();
        $('#fj-score-display').text("Your Score: $" + currentScore);

        $('#fj-wager-container').show();
    });

    function submitFJWager() {
        const wager = $('#fj-wager').val();
        socket.emit('player_fj_wager', {wager: wager});
        $('#fj-wager-container').hide();
        $('#fj-wait').show();
    }

    socket.on('show_fj_clue', (data) => {
        $('#fj-wait').hide();
        $('#fj-answer-container').show();
    });

    function submitFJAnswer() {
        const answer = $('#fj-answer').val();
        socket.emit('player_fj_answer', {answer: answer});
        $('#fj-answer-container').hide();
        $('#fj-wait').show();
    }

    socket.on('start_timer', (data) => {
        if (data.show_countdown && isMyTurn) {
            startPlayerTimer(data.duration);
        }
    });

    // Render optional media on player devices (may be image/video/audio or iframe)
    socket.on('show_clue', (clue) => {
        $('#media-container').empty();
        if (clue.media) {
            const m = clue.media;
            if (m.type === 'image') {
                $('#media-container').append(`<img src="${m.src}" alt="${m.caption||''}" style="max-width: 90%; max-height: 30vh;">`);
            } else if (m.type === 'audio') {
                const a = $(`<audio controls autoplay src="${m.src}" style="width:90%;"></audio>`);
                $('#media-container').append(a);
                a.on('ended', () => { socket.emit('media_ended', {}); });
            } else if (m.type === 'video') {
                const v = $(`<video controls playsinline autoplay preload="metadata" src="${m.src}" style="max-width:90%; max-height:30vh;"></video>`);
                if (m.poster) v.attr('poster', m.poster);
                $('#media-container').append(v);

                const el = v.get(0);
                if (el) {
                    try { el.load(); } catch (e) {}
                    try {
                        const p = el.play();
                        if (p && p.catch) {
                            p.catch(() => {
                                try {
                                    if (!el.muted) {
                                        el.muted = true;
                                        const p2 = el.play();
                                        if (p2 && p2.catch) {
                                            p2.catch(() => {
                                                $('#media-container').append(`<div class="media-caption">Autoplay blocked. Tap play to start the video.</div>`);
                                            });
                                        }
                                        $('#media-container').append(`<div class="media-caption">Autoplay blocked by browser. Playing muted — use the video controls to unmute.</div>`);
                                    } else {
                                        $('#media-container').append(`<div class="media-caption">Autoplay blocked. Tap play to start the video.</div>`);
                                    }
                                } catch (e) {
                                    $('#media-container').append(`<div class="media-caption">Autoplay blocked. Tap play to start the video.</div>`);
                                }
                            });
                        }
                    } catch (e) {}
                }
                v.on('ended', () => { socket.emit('media_ended', {}); });
                v.on('error', () => {
                    const el2 = v.get(0);
                    const code = (el2 && el2.error) ? el2.error.code : 'unknown';
                    const ns = (el2 && typeof el2.networkState !== 'undefined') ? el2.networkState : 'unknown';
                    const rs = (el2 && typeof el2.readyState !== 'undefined') ? el2.readyState : 'unknown';
                    $('#media-container').append(`<div class="media-caption">Video failed to load (code=${code}, network=${ns}, ready=${rs}). Try opening <a href="${m.src}" target="_blank" rel="noopener">${m.src}</a></div>`);
                });
            } else if (m.type === 'iframe') {
                $('#media-container').append(`<iframe src="${m.src}" style="width:90%; height:30vh;" frameborder="0" allow="autoplay; encrypted-media"></iframe>`);
            }
            if (m.caption) $('#media-container').append(`<div class="media-caption">${m.caption}</div>`);
        }
    });

    socket.on('hide_clue', () => {
        clearPlayerTimer();
        $('#player-timer').hide();
        isMyTurn = false;
    });

    socket.on('player_timed_out', (data) => {
        // If anyone times out, hide any player timers and show a message
        clearPlayerTimer();
        $('#player-timer').hide();
        if (data && data.name) {
            $('#status').text(`${data.name} timed out`);
        } else {
            $('#status').text('Player timed out');
        }
    });

</script>
{% endblock %}
